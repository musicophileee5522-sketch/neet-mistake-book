<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEET Mistake Book</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6e9;--card:#fffdf6;--ink:#2b2a33;--mut:#7a766b;--red:#c8372d;--blue:#2f5fb3;--line:#e6dcc3;--ok:#2e8b57;--hl:#fff1a8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1a1920;--card:#23222b;--ink:#ece8dc;--mut:#9b978b;--red:#ff7a6e;--blue:#8db4ff;--line:#34323d;--ok:#5fd08f;--hl:#4a4320}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1a1920;--card:#23222b;--ink:#ece8dc;--mut:#9b978b;--red:#ff7a6e;--blue:#8db4ff;--line:#34323d;--ok:#5fd08f;--hl:#4a4320}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background-image:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:900px;margin:0 auto;padding:14px 14px 80px}
h1,h2,.hand{font-family:Caveat,"Bradley Hand","Segoe Script",cursive;font-weight:700;margin:0}
h1{font-size:34px;color:var(--red)}h2{font-size:26px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tabs{display:flex;gap:6px;margin:10px 0 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0}
.tabs button{flex:1;padding:10px 6px;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg)}
.card{background:var(--card);border:1.5px solid var(--line);border-left:4px solid var(--red);border-radius:10px;padding:14px;margin-bottom:12px;overflow-wrap:anywhere}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.cd div{background:var(--hl);border-radius:10px;padding:8px 2px}.cd b{display:block;font:700 34px Caveat,cursive;line-height:1.1}.cd span{font-size:12px;color:var(--mut)}
.quote{font:600 24px/1.25 Caveat,cursive;color:var(--blue)}
input,select,textarea{width:100%;padding:9px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:64px;resize:vertical}label{font-size:13px;color:var(--mut);display:block;margin:8px 0 3px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.btn{padding:10px 14px;border:2px solid var(--ink);border-radius:10px;background:var(--red);color:#fff;font-weight:700;cursor:pointer;flex:0 0 auto}
.btn.g{background:var(--card);color:var(--ink)}.btn.s{padding:5px 9px;font-size:13px}.btn:disabled{opacity:.5}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--hl);font-size:12px;margin-right:4px}
.chip.due{background:var(--red);color:#fff}.mut{color:var(--mut);font-size:13px}
.opt{display:block;width:100%;text-align:left;padding:10px;margin:6px 0;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.opt.sel{border-color:var(--blue);background:var(--hl)}.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,var(--bg))}.opt.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 20%,var(--bg))}
.pal{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.pal button{width:34px;height:34px;border:1.5px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);cursor:pointer;font-size:12px}
.pal .a{background:var(--blue);color:#fff}.pal .c{outline:2px solid var(--red)}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red);width:0;transition:width .3s}
.expl{background:var(--hl);border-radius:8px;padding:9px;margin-top:8px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.stats div{text-align:center;background:var(--bg);border-radius:9px;padding:8px}.stats b{font:700 30px Caveat,cursive;display:block}
</style></head><body><div class="wrap">
<div class="top"><div><h1>✎ My Mistake Book</h1><div class="mut">Every mistake is a free lesson. Write it down, never repeat it.</div></div><button class="btn g s" id="th">🌓</button></div>
<div class="tabs" id="tabs"></div><div id="v"></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SUBS=["Physics","Chemistry","Botany","Zoology"],GAP=[1,3,7,14,30],DAY=864e5;
const Q=["You don’t need to be perfect. You need to be better than yesterday.","Every question you got wrong today is one mark you’ll win on exam day.","The white coat is built one revision at a time.","Doubt kills more dreams than failure ever will. Keep going.","Your NCERT is your best friend. Read it line by line.","Tired? Rest, don’t quit. Tomorrow’s you will thank today’s you.","Rank is temporary. The doctor you become is forever.","Small daily improvements are the secret of big results.","Mistakes are proof that you are trying. Fix them and rise.","Don’t count the days. Make the days count."];
let S={date:"2027-05-02",m:[],qi:0,hist:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem("nbk")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("nbk",JSON.stringify(S))}catch(e){}};
let tab="home",T=null,tick=null,filt="All",dueOnly=false,gen=null;
const tabs=[["home","🏠 Home"],["book","📒 Mistakes"],["test","🤖 AI Test"]];
function nav(){$("#tabs").innerHTML=tabs.map(t=>`<button class="${tab==t[0]?"on":""}" data-t="${t[0]}">${t[1]}</button>`).join("");$("#tabs").onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;render()}}}
$("#th").onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=d?"light":"dark"};
const dueN=()=>S.m.filter(x=>!x.done&&x.due<=Date.now()).length;
function render(){clearInterval(tick);nav();({home,book,test})[tab]()}
/* HOME */
function home(){
const mast=S.m.filter(x=>x.done).length,sc=SUBS.map(s=>[s,S.m.filter(x=>x.sub==s).length]);
$("#v").innerHTML=`<div class="card"><h2>⏳ NEET countdown</h2><div class="cd" id="cd"></div>
<div class="row" style="margin-top:8px;align-items:center"><span class="mut" style="flex:0 0 auto">Exam date</span><input type="date" id="ed" value="${S.date}" style="max-width:170px"></div><div class="mut">Set this to the official date once NTA announces it.</div></div>
<div class="card"><div class="quote" id="q"></div><button class="btn g s" id="nq" style="margin-top:8px">New quote ↻</button></div>
<div class="card"><h2>Your progress</h2><div class="stats"><div><b>${S.m.length}</b>mistakes logged</div><div><b style="color:var(--red)">${dueN()}</b>due for revision</div><div><b style="color:var(--ok)">${mast}</b>mastered</div><div><b>${S.hist.length}</b>tests taken</div></div>
<div class="mut" style="margin-top:8px">${sc.map(x=>x[0]+": "+x[1]).join(" · ")}</div>
${S.hist.length?`<div class="mut">Last test: ${S.hist.slice(-3).map(h=>h.sc+"/"+h.max).join(" → ")}</div>`:""}</div>`;
const q=()=>$("#q").textContent="“"+Q[Math.floor(Math.random()*Q.length)]+"”";q();$("#nq").onclick=q;
$("#ed").onchange=e=>{S.date=e.target.value;save();cd()};
const cd=()=>{const el=$("#cd");if(!el){clearInterval(tick);return}let d=new Date(S.date+"T09:00:00")-Date.now();if(isNaN(d))d=0;const neg=d<0;d=Math.max(d,0);
el.innerHTML=[["days",Math.floor(d/DAY)],["hours",Math.floor(d%DAY/36e5)],["mins",Math.floor(d%36e5/6e4)],["secs",Math.floor(d%6e4/1e3)]].map(x=>`<div><b>${x[1]}</b><span>${x[0]}</span></div>`).join("")};
cd();tick=setInterval(cd,1000)}
/* MISTAKE BOOK */
function book(){
const L=S.m.filter(x=>(filt=="All"||x.sub==filt)&&(!dueOnly||(!x.done&&x.due<=Date.now()))).sort((a,b)=>a.due-b.due);
$("#v").innerHTML=`<div class="card"><h2>+ Write a new mistake</h2>
<div class="row"><div><label>Subject</label><select id="s">${SUBS.map(s=>`<option>${s}</option>`).join("")}</select></div><div><label>Chapter / topic</label><input id="t" placeholder="e.g. Ray optics – lens maker’s formula"></div></div>
<label>What went wrong? (question / my wrong thinking)</label><textarea id="w"></textarea>
<label>Correct concept / formula to remember</label><textarea id="r"></textarea>
<button class="btn" id="add" style="margin-top:10px">Save to book</button></div>
<div class="row" style="margin-bottom:10px;align-items:center"><select id="f"><option>All</option>${SUBS.map(s=>`<option ${filt==s?"selected":""}>${s}</option>`).join("")}</select><label style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" id="d" style="width:auto" ${dueOnly?"checked":""}> Due for revision only (${dueN()})</label></div>
${L.length?L.map(card).join(""):`<div class="card mut">Nothing here yet. Add mistakes from your practice tests or from the AI test review.</div>`}`;
$("#add").onclick=()=>{const t=$("#t").value.trim(),r=$("#r").value.trim();if(!t||!r){alert("Add a topic and the correct concept.");return}addM({sub:$("#s").value,topic:t,wrong:$("#w").value.trim(),right:r});book()};
$("#f").onchange=e=>{filt=e.target.value;book()};$("#d").onchange=e=>{dueOnly=e.target.checked;book()};
$("#v").onclick=e=>{const b=e.target.closest("[data-a]");if(!b)return;const m=S.m.find(x=>x.id==b.dataset.id);if(!m)return;const a=b.dataset.a;
if(a=="del")S.m=S.m.filter(x=>x!=m);
if(a=="got"){m.st++;if(m.st>=GAP.length)m.done=1;else m.due=Date.now()+GAP[m.st]*DAY}
if(a=="forgot"){m.st=0;m.due=Date.now()+DAY;m.done=0}
save();book()}}
function addM(o){S.m.push({id:Date.now()+Math.random(),st:0,due:Date.now()+DAY,done:0,...o});save()}
function card(m){const due=!m.done&&m.due<=Date.now(),dd=Math.ceil((m.due-Date.now())/DAY);
return `<div class="card"><span class="chip">${esc(m.sub)}</span>${m.done?`<span class="chip" style="background:var(--ok);color:#fff">Mastered ✓</span>`:due?`<span class="chip due">Revise today</span>`:`<span class="chip">Next revision in ${dd}d</span>`}
<div class="hand" style="font-size:24px;margin-top:4px">${esc(m.topic)}</div>
${m.wrong?`<div><span class="mut">✗ My mistake:</span> ${esc(m.wrong)}</div>`:""}
<div><span class="mut">✓ Remember:</span> <mark style="background:var(--hl);color:inherit">${esc(m.right)}</mark></div>
<div class="row" style="margin-top:8px">${m.done?"":`<button class="btn s" data-a="got" data-id="${m.id}">I remembered it ✓</button><button class="btn g s" data-a="forgot" data-id="${m.id}">Forgot again ✗</button>`}<button class="btn g s" data-a="del" data-id="${m.id}">Delete</button></div></div>`}
/* AI TEST */
async function test(){
if(gen){return genView()}
if(T&&!T.done)return qView();if(T&&T.done)return resView();
$("#v").innerHTML=`<div class="card"><h2>🤖 Generate a NCERT-based test</h2><div class="mut">Fresh AI-written questions every time: mixed concepts, statement and assertion-reason types, easy to hard, each with an explanation.</div>
<div class="row"><div><label>Scope</label><select id="sc"><option>Full syllabus (all 4 subjects)</option>${SUBS.map(s=>`<option>${s}</option>`).join("")}</select></div>
<div><label>Questions (20 to 180)</label><input type="number" id="n" min="20" max="180" step="5" value="45"></div>
<div><label>Difficulty</label><select id="df"><option>Mixed (easy + medium + hard)</option><option>Easy</option><option>Medium</option><option>Hard</option></select></div></div>
<label>Chapter or topic focus (optional)</label><input id="tp" placeholder="e.g. Human physiology, Thermodynamics">
<div class="row" style="margin-top:6px">${[20,45,90,180].map(n=>`<button class="btn g s" data-n="${n}">${n}</button>`).join("")}</div>
<button class="btn" id="go" style="margin-top:12px">Generate test</button>
<div class="mut" style="margin-top:8px">Marking: +4 correct, −1 wrong. Large tests take a few minutes to write.</div></div>`;
$("#v").onclick=e=>{if(e.target.dataset.n)$("#n").value=e.target.dataset.n};
$("#go").onclick=()=>start($("#sc").value,Math.min(180,Math.max(20,+$("#n").value||45)),$("#df").value,$("#tp").value.trim())}
const genView=()=>{$("#v").innerHTML=`<div class="card"><h2>Writing your paper…</h2><div class="bar"><i id="pb" style="width:${gen.p}%"></i></div><div class="mut" id="pt">${gen.t}</div></div>`};
async function start(scope,n,df,tp){
const sample={json:async p=>{const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:p})});const d=await r.json().catch(()=>({}));if(!r.ok)throw{code:r.status==429?"rate_limited":"err",message:d.error||"Server error"};return d.questions}};
const full=scope.startsWith("Full"),plan=[];for(let i=0;i<n;i++)plan.push(full?SUBS[i%4]:scope);
const CH=15,chunks=[];for(let i=0;i<n;i+=CH)chunks.push(plan.slice(i,i+CH));
gen={p:2,t:"Starting…"};genView();let done=0,out=[];
const run=async(ch,k)=>{const cnt={};ch.forEach(s=>cnt[s]=(cnt[s]||0)+1);
const pr=`You are an expert NEET UG paper setter. Write ${ch.length} MCQs strictly based on NCERT Class 11 and 12 content. Subject counts: ${JSON.stringify(cnt)}. Difficulty: ${df}${df.startsWith("Mixed")?" (about 30% easy, 45% medium, 25% hard)":""}.${tp?" Focus on: "+tp+".":""} This is batch ${k+1} of ${chunks.length}: choose different chapters from other batches. Mix formats: direct, statement-based (“which statements are correct”), assertion-reason, match-the-column, numerical, and concept-mixing questions. Exactly 4 options, exactly 1 correct, plausible distractors. Explanation: 2-3 sentences, why the answer is right and why the common trap is wrong. Return ONLY a JSON array of objects: {"s":"Physics|Chemistry|Botany|Zoology","t":"chapter - topic","d":"Easy|Medium|Hard","q":"question","o":["A","B","C","D"],"a":0,"e":"explanation"} where a is the correct option index 0-3.`;
for(let r=0;r<2;r++){try{const j=await sample.json(pr,{cache:false});const ok=(Array.isArray(j)?j:[]).filter(x=>x&&x.q&&Array.isArray(x.o)&&x.o.length==4&&x.a>=0&&x.a<4);if(ok.length){out[k]=ok;break}}catch(e){if(e&&e.code=="rate_limited"){gen=null;alert(e.message);return render()}}}
done++;gen.p=Math.round(done/chunks.length*100);gen.t=`Batch ${done} of ${chunks.length} ready`;if(tab=="test"&&gen)genView()};
const q=chunks.map((c,i)=>i);const worker=async()=>{while(q.length){const i=q.shift();await run(chunks[i],i)}};
await Promise.all([worker(),worker(),worker()]);
const qs=out.flat().filter(Boolean).slice(0,n);gen=null;
if(!qs.length){alert("Could not generate questions. Please try again.");return render()}
T={qs,ans:qs.map(()=>-1),i:0,t0:Date.now(),done:0,scope};if(tab=="test")render()}
function qView(){
const q=T.qs[T.i],ans=T.ans;
$("#v").innerHTML=`<div class="card"><div class="top"><b class="hand" style="font-size:22px">Q ${T.i+1}/${T.qs.length}</b><span class="mut">⏱ <span id="tm"></span> · answered ${ans.filter(a=>a>=0).length}</span></div>
<span class="chip">${esc(q.s)}</span><span class="chip">${esc(q.d)}</span><span class="mut">${esc(q.t)}</span>
<p style="white-space:pre-wrap;font-weight:500">${esc(q.q)}</p>
${q.o.map((o,i)=>`<button class="opt ${ans[T.i]==i?"sel":""}" data-o="${i}">${"ABCD"[i]}. ${esc(o)}</button>`).join("")}
<div class="row" style="margin-top:8px"><button class="btn g" id="pv" ${T.i?"":"disabled"}>← Prev</button><button class="btn g" id="cl">Clear</button>${T.i<T.qs.length-1?`<button class="btn" id="nx">Next →</button>`:`<button class="btn" id="sb">Submit test</button>`}</div></div>
<div class="card"><div class="pal">${T.qs.map((_,i)=>`<button class="${ans[i]>=0?"a":""} ${i==T.i?"c":""}" data-g="${i}">${i+1}</button>`).join("")}</div><button class="btn g s" id="sb2">Submit now</button></div>`;
const tm=()=>{const e=$("#tm");if(!e){clearInterval(tick);return}const s=Math.floor((Date.now()-T.t0)/1e3);e.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};tm();tick=setInterval(tm,1000);
$("#v").onclick=e=>{const t=e.target.closest("button");if(!t)return;
if(t.dataset.o!=null)T.ans[T.i]=+t.dataset.o;else if(t.dataset.g!=null)T.i=+t.dataset.g;
else if(t.id=="pv")T.i--;else if(t.id=="nx")T.i++;else if(t.id=="cl")T.ans[T.i]=-1;
else if(t.id=="sb"||t.id=="sb2"){T.done=1;T.secs=Math.floor((Date.now()-T.t0)/1e3);const c=T.qs.filter((q,i)=>T.ans[i]==q.a).length,w=T.ans.filter((a,i)=>a>=0&&a!=T.qs[i].a).length;S.hist.push({sc:c*4-w,max:T.qs.length*4});save();return render()}
qView()}}
function resView(){
const c=T.qs.filter((q,i)=>T.ans[i]==q.a).length,w=T.ans.filter((a,i)=>a>=0&&a!=T.qs[i].a).length,sk=T.qs.length-c-w;
const bysub=SUBS.map(s=>{const ix=T.qs.map((q,i)=>q.s==s?i:-1).filter(i=>i>=0);return ix.length?`${s}: ${ix.filter(i=>T.ans[i]==T.qs[i].a).length}/${ix.length}`:null}).filter(Boolean);
$("#v").innerHTML=`<div class="card"><h2>Result</h2><div class="stats"><div><b>${c*4-w}/${T.qs.length*4}</b>score</div><div><b style="color:var(--ok)">${c}</b>correct</div><div><b style="color:var(--red)">${w}</b>wrong</div><div><b>${sk}</b>skipped</div></div>
<div class="mut" style="margin-top:8px">${bysub.join(" · ")} · Time ${Math.floor(T.secs/60)} min</div>
<div class="row" style="margin-top:10px"><button class="btn" id="aw">+ Add all wrong &amp; skipped to Mistake Book</button><button class="btn g" id="nt">New test</button></div></div>
${T.qs.map((q,i)=>{const a=T.ans[i],ok=a==q.a;return `<div class="card"><span class="chip">${esc(q.s)}</span><span class="chip">${esc(q.d)}</span><span class="chip" style="background:${ok?"var(--ok);color:#fff":a<0?"var(--line)":"var(--red);color:#fff"}">${ok?"Correct":a<0?"Skipped":"Wrong"}</span>
<p style="white-space:pre-wrap"><b>${i+1}.</b> ${esc(q.q)}</p>${q.o.map((o,j)=>`<div class="opt ${j==q.a?"ok":j==a?"bad":""}">${"ABCD"[j]}. ${esc(o)}</div>`).join("")}
<div class="expl">💡 ${esc(q.e)}</div>${ok?"":`<button class="btn s" data-add="${i}" style="margin-top:8px">+ Add to Mistake Book</button>`}</div>`}).join("")}`;
const add=i=>{const q=T.qs[i];if(q.added)return;q.added=1;const a=T.ans[i];addM({sub:q.s,topic:q.t,wrong:q.q+(a>=0?` (I chose: ${q.o[a]})`:" (skipped)"),right:`${q.o[q.a]}. ${q.e}`})};
$("#v").onclick=e=>{const t=e.target.closest("button");if(!t)return;
if(t.dataset.add){add(+t.dataset.add);t.textContent="Added ✓";t.disabled=true}
if(t.id=="aw"){T.qs.forEach((q,i)=>{if(T.ans[i]!=q.a)add(i)});t.textContent="Added to your book ✓";t.disabled=true}
if(t.id=="nt"){T=null;render()}}}
render();
</script></body></html>
